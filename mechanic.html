<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AutoAid • Mechanic Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, sans-serif; background:#f4f6fb; }
    .wrap { max-width: 1100px; margin: 18px auto; padding: 0 14px; }
    .top {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:#fff; padding:14px; border-radius:14px; border:1px solid #e7e7ef;
    }
    .title h2 { margin:0; }
    .title small { color:#666; }
    .btns { display:flex; gap:10px; flex-wrap:wrap; }
    button {
      padding:10px 12px; border-radius:10px; border:1px solid #ddd;
      background:#fff; cursor:pointer; font-weight:600;
    }
    button:hover { background:#f2f2f7; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:12px; }
    .card { background:#fff; border:1px solid #e7e7ef; border-radius:14px; padding:12px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #eee; padding:10px; vertical-align: top; }
    th { text-align:left; font-size: 13px; color:#333; background:#fafafa; }
    .msg { padding:10px; border-radius:10px; margin-top:10px; display:none; }
    .ok { background:#e7ffe7; }
    .err { background:#ffe7e7; }
    .badge { padding:4px 8px; border-radius:999px; font-size:12px; background:#eef2ff; display:inline-block; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">
        <h2>Mechanic Panel</h2>
        <small id="mechInfo">Checking mechanic...</small>
      </div>
      <div class="btns">
        <button onclick="updateMyLocation()">Update My GPS</button>
        <button onclick="loadOpenRequests()">Refresh Open Requests</button>
        <button onclick="loadMyAccepted()">My Accepted</button>
        <button onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <div class="grid">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>Open Requests (Nearby First)</b>
          <span class="badge" id="openCount">0</span>
        </div>
        <div style="margin-top:10px; max-height: 520px; overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Issue + Distance</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="openBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>My Accepted Requests</b>
          <span class="badge" id="myCount">0</span>
        </div>
        <div style="margin-top:10px; max-height: 520px; overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Vehicle + Issue</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="myBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    initMechanic();
  </script>
</body>
</html>
